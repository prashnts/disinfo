[program:di2pcstate]
command=/home/noop/run/disinfo/.venv/bin/python -m disinfo.renderers.background --fps 12
directory=/home/noop/run/disinfo
user=noop
environment=DI_CONFIG_PATH=".config-pcstate.json"

[program:di2pcstate_server]
command=/home/noop/run/disinfo/.venv/bin/python -m uvicorn disinfo.web.server:app --host 0.0.0.0 --port 4250
directory=/home/noop/run/disinfo
user=noop
environment=DI_CONFIG_PATH=".config-pcstate.json"
