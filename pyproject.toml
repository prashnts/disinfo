[project]
name = "disinfo"
version = "0.4.6"
description = "Add your description here"
readme = "README.md"
requires-python = "==3.13.*"
dependencies = [
    "pillow==13.0.0",
    "numpy",
    "h5py",
    "pyproj",
    "watchdog>=3.0.0",
    "requests>=2.25.1",
    "redis[hiredis]>=4.5.4",
    "hiredis>=3.4.2",       # 3.2.1-3.4.1 leak a list per pubsub message with redis 8 (hiredis-py#250)
    "schedule>=1.2.0",
    "colour>=0.1.5",
    "typer",
    "pydantic>=2.12.5",
    "fastapi>=0.100.0",
    "uvicorn[standard]>=0.23.1",
    "suncalc>=0.1.3",
    "cairosvg>=2.7.1",
    "websocket-client>=1.8.0",
    "redis-om>=1.0.6",
    "lru-dict>=1.4.1",
    "discore",
]

[project.optional-dependencies]
# the standalone remotes' hub (data service, config remotes_port): the disinfo-remote repo beside this one
remotes = ["disinfo-remote"]

[tool.uv.sources]
discore = { path = "libs/discore", editable = true }
disinfo-remote = { path = "../disinfo-remote", editable = true }
websocket-rpi-matrix = { path = "clients/websocket-rpi-matrix", editable = true }

[dependency-groups]
dev = [
    "ipython",
    "jupyterlab>=4.6.0",
    "plotly>=6.8.0",
    "pytest>=9.1.1",
    "watchdog>=6.0.0",
    "websocket-rpi-matrix",
]

[tool.pytest.ini_options]
# uv run pytest: discore's tests and the app's.
testpaths = ["libs/discore/tests", "tests"]
pythonpath = ["."]
