<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, minimum-scale=1, viewport-fit=cover">
    <title>disinfo!</title>
    <style>
        :root {
            --bg: #2c2c2c;
            --panel: #222;
            --line: #444;
            --text: #ddd;
            --dim: #888;
            --accent: #e8a25c;
            font: 11px/1.45 ui-monospace, 'SF Mono', Menlo, Consolas, monospace;
            color: var(--text);
            background: var(--bg);
        }
        body { margin: 0; display: flex; min-height: 100vh; }
        main { flex: 1; min-width: 0; padding: 12px; }
        aside {
            width: 340px; flex-shrink: 0; background: var(--panel); border-left: 1px solid var(--line);
            position: sticky; top: 0; height: 100vh; overflow-y: auto; box-sizing: border-box;
        }
        aside:empty, body.undocked aside { display: none; }
        body.panel main { display: none; }
        body.panel aside { width: 100%; border: 0; }
        @media (max-width: 720px) {
            body { flex-direction: column; }
            aside { width: 100%; height: auto; position: static; border: 0; border-top: 1px solid var(--line); }
        }

        h1 { font-size: 13px; margin: 0 0 8px; letter-spacing: 1px; }
        h2 { font-size: 10px; color: var(--dim); text-transform: uppercase; letter-spacing: 1px; margin: 14px 0 6px; font-weight: normal; }
        h2 small { float: right; text-transform: none; letter-spacing: 0; }
        #status { color: var(--dim); }
        #status:empty { display: none; }

        /* The screens, as their renderers send them: a touch goes to the server. */
        .screens { display: flex; flex-wrap: wrap; gap: 12px; align-items: flex-start; }
        figure { margin: 0; display: none; }
        figure.live { display: block; }
        figure button { margin-top: 4px; }
        figure.picked canvas { border-color: var(--accent); }
        canvas {
            display: block; max-width: 100%; image-rendering: pixelated; touch-action: none;
            filter: brightness(1.2) contrast(0.9); border: 2px solid #0C161C; border-radius: 3px;
        }
        #study, #salon { width: 256px; }
        #pcstate, #entry { width: 400px; }

        /* The controls. */
        button, select, input[type=text], input[type=number] {
            font: inherit; color: var(--text); background: #333; border: 1px solid var(--line); border-radius: 2px;
            padding: 3px 7px; touch-action: manipulation;
        }
        button { text-transform: uppercase; letter-spacing: 0.5px; cursor: pointer; }
        button:hover { border-color: var(--dim); }
        button.on { border-color: var(--accent); color: var(--accent); }
        input[type=checkbox] { accent-color: var(--accent); margin: 0 6px 0 0; vertical-align: -2px; }
        input[type=range] { width: 100%; accent-color: var(--accent); margin: 0; }
        input[type=number] { width: 4em; }
        input[type=text] { width: 100%; box-sizing: border-box; }
        textarea { width: 100%; box-sizing: border-box; font: inherit; color: var(--text); background: #333; border: 1px solid var(--line); border-radius: 2px; padding: 3px 7px; }
        label { cursor: pointer; }
        code { color: var(--accent); }
        small, .dim { color: var(--dim); }

        .bar { display: flex; gap: 4px; flex-wrap: wrap; align-items: center; }
        .top { padding: 10px 12px; border-bottom: 1px solid var(--line); }
        .top .bar + .bar { margin-top: 8px; }
        .tabs { display: flex; border-bottom: 1px solid var(--line); }
        .tabs button { flex: 1; border: 0; border-bottom: 2px solid transparent; background: none; border-radius: 0; padding: 8px 0; }
        .tabs button.on { border-bottom-color: var(--accent); }
        .tab { padding: 4px 12px 16px; }
        .range { display: grid; grid-template-columns: 5.5em 1fr 6em; gap: 8px; align-items: center; margin: 4px 0; }
        .range code { text-align: right; }
        .checks { display: grid; grid-template-columns: 1fr 1fr; gap: 2px 8px; }
        .row { display: flex; align-items: center; gap: 6px; margin: 3px 0; }
        .row > :first-child { flex: 1; }
        .grow { flex: 1; }
        table { border-collapse: collapse; width: 100%; }
        td { padding: 1px 0; }
        td + td { text-align: right; }

        .compass { display: block; width: 100%; max-width: 280px; margin: 6px auto; touch-action: none; cursor: crosshair; user-select: none; }
        .compass text { font: 8px ui-monospace, monospace; fill: var(--dim); }
        .compass .plane { cursor: pointer; }

        .icon { display: inline-block; width: 16px; height: 16px; vertical-align: -3px; background: currentColor;
                -webkit-mask: var(--i) center / contain no-repeat; mask: var(--i) center / contain no-repeat; }
        .icons { display: grid; grid-template-columns: repeat(8, 1fr); gap: 2px; margin: 4px 0; }
        .icons button { padding: 3px 0; }
        .ringing { color: var(--accent); }

        .smokes strong { font-size: 18px; }
        .ember { color: var(--accent); }
    </style>
</head>
<body>
    <main>
        <h1>disinfo!</h1>
        <p id='status'>connecting…</p>
        <div class="screens">
            <figure data-screen="distudy"><canvas id='study'></canvas><button>study</button></figure>
            <figure data-screen="disalon"><canvas id='salon'></canvas><button>salon</button></figure>
            <figure data-screen="dientry"><canvas id='entry'></canvas><button>entry</button></figure>
            <figure data-screen="di_pcstate"><canvas id='pcstate'></canvas><button>pc</button></figure>
        </div>
    </main>
    <aside id='controls'></aside>

    <script type="module">
        // The undocked panel: this page with ?panel, the controls alone.
        if (new URLSearchParams(location.search).has('panel')) document.body.classList.add('panel')
    </script>
    <script type="module">
        const WS_RETRY_DELAY = 2000;
        // /ws2 messages, see disinfo/transport.py: header, then a whole PNG, or the regions that changed.
        const HEADER = 21, REGION = 12;
        const status = document.getElementById('status');
        let seen = false;

        const png = (buf, at, n) => createImageBitmap(new Blob([new Uint8Array(buf, at, n)], {type: 'image/png'}));

        const connect = function (screen, canvas_id) {
            const protocol = window.location.protocol === 'https:' ? 'wss' : 'ws';
            const ws = new WebSocket(`${protocol}://${window.location.host}/ws2/${screen}?fmt=png`);
            ws.binaryType = 'arraybuffer';
            const canvas = document.getElementById(canvas_id);
            const ctx = canvas.getContext('2d');
            let seq = 0, resyncing = false, drawing = Promise.resolve();

            async function apply(buf) {
                const v = new DataView(buf);
                const next = v.getUint32(4, true), base = v.getUint32(8, true);
                if (!base) {
                    const frame = await png(buf, HEADER, buf.byteLength - HEADER);
                    canvas.width = v.getUint16(16, true);
                    canvas.height = v.getUint16(18, true);
                    ctx.drawImage(frame, 0, 0);
                    seq = next, resyncing = false;
                    canvas.parentElement.classList.add('live');
                    seen = true;
                    status.textContent = '';
                    return;
                }
                if (base !== seq) {
                    if (!resyncing) ws.send(JSON.stringify({resync: 1}));
                    resyncing = true;
                    return;
                }
                // Decoded first, then drawn together: never half a frame.
                const parts = [];
                let at = HEADER + 2;
                for (let i = 0; i < v.getUint16(HEADER, true); i++) {
                    const n = v.getUint32(at + 8, true);
                    parts.push([v.getUint16(at, true), v.getUint16(at + 2, true), png(buf, at + REGION, n)]);
                    at += REGION + n;
                }
                const frames = await Promise.all(parts.map(p => p[2]));
                parts.forEach(([x, y], i) => ctx.drawImage(frames[i], x, y));
                seq = next;
            }

            // Touches, in the frame's px: the server finds what's under them (buttons drawn by disinfo).
            const touch = (phase) => (e) => {
                if (phase !== 'down' && !canvas.hasPointerCapture(e.pointerId)) return;
                if (phase === 'down') canvas.setPointerCapture(e.pointerId);
                const r = canvas.getBoundingClientRect();
                const x = Math.floor((e.clientX - r.left - canvas.clientLeft) * canvas.width / canvas.clientWidth);
                const y = Math.floor((e.clientY - r.top - canvas.clientTop) * canvas.height / canvas.clientHeight);
                if (ws.readyState === WebSocket.OPEN) ws.send(JSON.stringify({touch: [x, y, phase]}));
            };
            canvas.onpointerdown = touch('down');
            canvas.onpointermove = touch('move');
            canvas.onpointerup = touch('up');

            ws.onmessage = function (event) {
                // Text: acts, alive. Frames are decoded in order.
                if (typeof event.data !== 'string') drawing = drawing.then(() => apply(event.data));
            };

            ws.onopen = function () {
                if (!seen) status.textContent = 'waiting for renderer…';
            };

            ws.onclose = function () {
                console.warn(`Disinfo connection lost. Retrying in ${WS_RETRY_DELAY / 1000}s.`)
                status.textContent = 'reconnecting…';
                setTimeout(() => connect(screen, canvas_id), WS_RETRY_DELAY);
            }

            ws.onerror = function () {
                ws.close();
            }
        }
        // Each server shows the screens it renders, the others stay hidden.
        if (!document.body.classList.contains('panel')) {
            connect('distudy', 'study');
            connect('disalon', 'salon');
            connect('di_pcstate', 'pcstate');
            connect('dientry', 'entry');
        }
    </script>
    <script type="module">
        import { h, render } from 'https://esm.sh/preact@10.24.3';
        import { useState, useEffect, useRef } from 'https://esm.sh/preact@10.24.3/hooks';
        import htm from 'https://esm.sh/htm@3.1.1';
        const html = htm.bind(h);

        const SCREENS = [['disalon', 'salon'], ['distudy', 'study'], ['dientry', 'entry'], ['di_pcstate', 'pc']];
        const VIEWS = ['map', 'sky', 'solar'];
        const LAYERS = ['builtup', 'green', 'water', 'roads', 'transit', 'clouds', 'rain', 'wind', 'planes', 'info'];
        const VIEW_HOLD = 3600;

        // The remote: numbers go as text (the server takes str, bool or null).
        const send = (action, payload = {}) => fetch('/remote', {
            method: 'POST',
            headers: {'Content-Type': 'application/json'},
            body: JSON.stringify({action, payload: Object.fromEntries(Object.entries(payload).map(([k, v]) => [k, typeof v === 'number' ? String(v) : v]))}),
        })
        const getJSON = url => fetch(url).then(r => r.json())
        const kept = (k, v) => { try { return v === undefined ? localStorage.getItem(k) : localStorage.setItem(k, v) } catch { return null } }

        // A setting by screen: its own, else the one for all ('*').
        const fresh = (sky, s) => sky?.live?.[s] && sky.now - sky.live[s].at < 30
        const onSky = (sky, s) => fresh(sky, s) && sky.live[s].yaw != null && (sky.live[s].view ?? 'sky') === 'sky'
        const pick = (d, screen, unset) => (screen !== 'all' && d?.[screen] !== undefined ? d[screen] : d?.['*']) ?? unset
        const own = (d, screen) => screen !== 'all' && d?.[screen] !== undefined

        function useFetch(url, every) {
            const [d, setD] = useState(null)
            const load = () => getJSON(url).then(setD).catch(() => {})
            useEffect(() => {
                load()
                if (!every) return
                const t = setInterval(load, every)
                return () => clearInterval(t)
            }, [url])
            return [d, () => setTimeout(load, 300)]
        }

        // While dragging: a few a second, the last one always.
        function useLive() {
            const last = useRef(0)
            return (action, payload, end) => {
                if (end || Date.now() - last.current > 150) {
                    last.current = Date.now()
                    send(action, payload)
                }
            }
        }

        function Range({label, min, max, step, value, show, onInput, onChange}) {
            return html`<label class="range">
                <span>${label}</span>
                <input type="range" min=${min} max=${max} step=${step} value=${value}
                    onInput=${e => onInput?.(+e.currentTarget.value)} onChange=${e => onChange?.(+e.currentTarget.value)}/>
                <code>${show ?? value}</code>
            </label>`
        }

        const Check = ({label, checked, onChange}) => html`
            <label><input type="checkbox" checked=${checked} onChange=${e => onChange(e.currentTarget.checked)}/>${label}</label>`

        const Btn = ({on, onClick, children, title}) => html`<button class=${on ? 'on' : ''} onClick=${onClick} title=${title}>${children}</button>`

        const Own = ({d, scope}) => own(d, scope) ? html`<small> · own</small>` : null
        const All = () => html`<small>all screens</small>`


        function ViewTab({scope, set, reload, sky}) {
            // Checked, the views take turns over the day; pressed, one shows for an hour (checked again).
            const views_off = pick(set.views_off, scope, [])
            const [pressed, at] = pick(set.view, scope, [null, 0])
            const held = pressed && Date.now() / 1000 - at < VIEW_HOLD
            const go = (action, p) => send(action, {...p, screen: scope}).then(reload)
            const [zen, loadZen] = useFetch('/shown')
            const zens = scope === 'all' ? SCREENS.map(s => s[0]) : [scope]
            const zenOn = zen && zens.every(s => zen.zen.includes(s))
            const setZen = on => Promise.all(zens.map(s => send('zen', {screen: s, on}))).then(loadZen)
            return html`<div class="tab">
                <h2>showing now</h2>
                <table>${SCREENS.map(([s, n]) => {
                    const l = sky?.live?.[s], sk = onSky(sky, s)
                    return html`<tr class=${fresh(sky, s) ? '' : 'dim'}><td>${n}</td>
                        <td>${fresh(sky, s) ? html`<code>${sk ? 'sky' : l.view}</code>${sk && l.demo ? ` · ${l.demo}` : ''}${sk && l.held ? ' · held' : ''}` : '–'}</td></tr>`
                })}</table>

                <h2>views <${Own} d=${set.view} scope=${scope}/></h2>
                ${VIEWS.map(v => html`<div class="row">
                    <${Check} label=${`${v} in turns`} checked=${!views_off.includes(v)} onChange=${on => go('aviator.views', {view: v, on})}/>
                    <${Btn} on=${held && pressed === v} onClick=${() => go('aviator.view', {view: v})}>${v}</${Btn}>
                </div>`)}
                <small>${held ? `${pressed} pressed, for ${Math.ceil((at + VIEW_HOLD - Date.now() / 1000) / 60)} min more (press again: let go)` : 'taking turns'}</small>
                <div class="row">
                    <${Check} label="link planes and sky" checked=${pick(set.link, scope, true)} onChange=${on => go('aviator.link', {on})}/>
                    <small>a glance at the map, then the sky on each plane; the Eiffel show</small>
                </div>
                <div class="row">
                    <${Check} label="a storm brings the sky" checked=${!views_off.includes('storm')} onChange=${on => go('aviator.views', {view: 'storm', on})}/>
                    <${Btn} onClick=${() => send('lightning.demo')} title="a storm passing, on every screen">storm demo</${Btn}>
                </div>

                <h2>zen</h2>
                <${Check} label=${`zen on ${scope === 'all' ? 'every screen' : scope}`} checked=${zenOn} onChange=${setZen}/>
                <div><small>time, weather, background, planes without labels; an hour</small></div>

                <${NoteBox} scope=${scope}/>
            </div>`
        }

        function NoteBox({scope}) {
            // A note at the bottom, for a while ('all': under each screen's own). Timed steps: POST /note or screens/note.py.
            const [notes, reload] = useFetch('/note', 5000)
            const [text, setText] = useState('')
            const [min, setMin] = useState(10)
            const post = (method, url, body) => fetch(url, {method, headers: {'Content-Type': 'application/json'}, body: body && JSON.stringify(body)}).then(reload)
            const up = Object.entries(notes || {})
            return html`
                <h2>note <small>${scope === 'all' ? 'every screen' : scope}</small></h2>
                <div class="row">
                    <input type="text" placeholder="text, | breaks lines" value=${text} onInput=${e => setText(e.currentTarget.value)}/>
                    <${Btn} onClick=${() => text && post('POST', '/note', {screen: scope, text, minutes: min})}>show</${Btn}>
                </div>
                <${Range} label="for" min="1" max="120" step="1" value=${min} show=${`${min} min`} onInput=${setMin}/>
                ${up.map(([s, n]) => html`<div class="row">
                    <span class="grow"><code>${s}</code> ${n.value.startsWith('{') ? 'steps' : n.value} <small>${Math.ceil(n.ttl / 60)} min</small></span>
                    <${Btn} onClick=${() => post('DELETE', `/note/${s}`)}>clear</${Btn}>
                </div>`)}`
        }


        function Compass({sky, scope, yaw, fov, onTurn}) {
            // Seen from the window, north up: the rim is the horizon, the middle overhead. Drag to turn.
            const R = 100
            const at = (b, r = R) => [r * Math.sin(b * Math.PI / 180), -r * Math.cos(b * Math.PI / 180)]
            const up = e => R * (1 - Math.min(Math.max(e, 0), 90) / 90)
            const wedge = (y, f, r = R) => {
                const [x0, y0] = at(y - f / 2, r), [x1, y1] = at(y + f / 2, r)
                return `M0,0 L${x0},${y0} A${r},${r} 0 ${f > 180 ? 1 : 0} 1 ${x1},${y1} Z`
            }
            const [w0, w1] = sky.window
            const ws = ((w1 - w0) % 360) || 360
            const svg = useRef(null)
            const turn = (e, end) => {
                if (!end && e.buttons !== 1) return
                const r = svg.current.getBoundingClientRect()
                const x = e.clientX - r.left - r.width / 2, y = e.clientY - r.top - r.height / 2
                onTurn(Math.round((Math.atan2(x, -y) * 180 / Math.PI + 360) % 360), end)
            }
            const shown = SCREENS.filter(([s]) => (scope === 'all' || s === scope) && onSky(sky, s))
            // Neighbours' names in turn nearer the middle.
            const marks = [...sky.landmarks].sort((a, b) => a[1] - b[1]).map(([n, b], i, all) => [n, b, i && b - all[i - 1][1] < 20 && i % 2])
            return html`<svg class="compass" viewBox="-120 -120 240 240" ref=${svg}
                    onPointerDown=${e => { e.currentTarget.setPointerCapture(e.pointerId); turn(e) }}
                    onPointerMove=${e => turn(e)} onPointerUp=${e => turn(e, true)}>
                <path d=${wedge(w0 + ws / 2, ws, R)} fill="#fff" opacity="0.04"/>
                <circle r=${R} fill="none" stroke="#555"/>
                <circle r=${R / 2} fill="none" stroke="#333"/>
                ${[0, 90, 180, 270].map((b, i) => { const [x, y] = at(b, R + 10); return html`<text x=${x} y=${y + 3} text-anchor="middle">${'NESW'[i]}</text>` })}
                ${shown.map(([s, n]) => { const l = sky.live[s], [x, y] = at(l.yaw, R + 10); return html`
                    <path d=${wedge(l.yaw, l.fov)} fill="#e8a25c" opacity="0.18"/>
                    ${scope === 'all' && html`<text x=${x} y=${y + 3} text-anchor="middle" style="fill:#e8a25c">${n}</text>`}` })}
                ${yaw != null && html`<path d=${wedge(yaw, fov)} fill="none" stroke="#e8a25c" stroke-dasharray="3 3"/>`}
                ${sky.waypoints.map(b => { const [x, y] = at(b, R - 3); return html`<circle cx=${x} cy=${y} r="1.2" fill="#888"/>` })}
                ${marks.map(([n, b, inner]) => { const [x, y] = at(b, R), [lx, ly] = at(b, inner ? R - 30 : R - 17); return html`
                    <line x1=${x} y1=${y} x2=${x * 0.92} y2=${y * 0.92} stroke="#aaa"/>
                    <text x=${lx} y=${ly + 3} text-anchor="middle">${n}</text>` })}
                ${sky.planes.map(([hex, name, b, e, , watched]) => { const [x, y] = at(b, up(e ?? 0)); return html`
                    <circle class="plane" cx=${x} cy=${y} r=${watched ? 3 : 1.8} fill=${watched ? '#9cf' : '#678'}
                        onPointerDown=${ev => { ev.stopPropagation(); send('aviator.open', {hex}) }}><title>${name}</title></circle>` })}
                ${[['sun', '#ffcc66', 5], ['moon', '#ccd', 4]].map(([k, c, r]) => {
                    const [b, e] = sky[k]; const [x, y] = at(b, e > 0 ? up(e) : R + 4)
                    return html`<circle cx=${x} cy=${y} r=${r} fill=${c} opacity=${e > 0 ? 1 : 0.3}><title>${k} ${e}°</title></circle>` })}
            </svg>`
        }

        function SkyTab({scope, set, reload, sky}) {
            // The sky view: turned and zoomed a while (then its own), where its horizon rests and how high one looks from (kept),
            // a scene of the demo held, its layers.
            const [yaw, setYaw] = useState(null)
            const [fov, setFov] = useState(50)
            const [h, setH] = useState(0.6)
            const [floors, setFloors] = useState(0)
            const [heldAt, setHeldAt] = useState(0)
            const live = useLive()
            const go = (action, p, end) => live(action, {...p, screen: scope}, end)
            useEffect(() => { setH(pick(set.horizon, scope, 0.6) || 0.6); setFloors(pick(set.floors, scope, 0)) }, [scope, set])
            if (!sky) return html`<div class="tab"><small>loading…</small></div>`

            const cur = sky.live[onSky(sky, scope) ? scope : SCREENS.map(s => s[0]).find(s => scope === 'all' && onSky(sky, s))]
            const left = Math.max(0, sky.hold_s - (Date.now() - heldAt) / 1000)
            const turn = (d, end) => { setYaw(d); setHeldAt(Date.now()); go('aviator.sky', {yaw: d}, end) }
            const zoom = (f, end) => { setFov(f); setHeldAt(Date.now()); go('aviator.sky', {fov: f}, end) }
            const release = () => { setYaw(null); setHeldAt(0); send('aviator.sky', {screen: scope}) }
            const compass = d => ['N', 'NE', 'E', 'SE', 'S', 'SW', 'W', 'NW'][Math.round(d / 45) % 8]
            const mean = bs => (Math.atan2(bs.reduce((a, b) => a + Math.sin(b * Math.PI / 180), 0), bs.reduce((a, b) => a + Math.cos(b * Math.PI / 180), 0)) * 180 / Math.PI + 360) % 360
            const off = pick(set.off, scope, [])
            const s = sky.sky, pct = v => v == null ? '–' : Math.round(v * 100) + '%', n = (v, u, d = 0) => v == null ? '–' : v.toFixed(d) + u
            const demo = cur?.demo
            return html`<div class="tab">
                <h2>look <small>${cur ? html`now <code>${Math.round(cur.yaw)}° ${compass(cur.yaw)}</code> · ${Math.round(cur.fov)}° wide` : 'not on the sky view'}</small></h2>
                <${Compass} sky=${sky} scope=${scope} yaw=${heldAt && left ? yaw : null} fov=${fov} onTurn=${turn}/>
                <div class="bar">
                    ${sky.landmarks.map(([name, b]) => html`<${Btn} onClick=${() => turn(Math.round(b), true)}>${name}</${Btn}>`)}
                    <${Btn} onClick=${() => turn(Math.round(mean(sky.waypoints)), true)}>waypoints</${Btn}>
                    <${Btn} onClick=${() => turn(Math.round(sky.sun[0]), true)}>sun</${Btn}>
                    <${Btn} onClick=${() => turn(Math.round(sky.moon[0]), true)}>moon</${Btn}>
                </div>
                <${Range} label="pan" min="0" max="359" step="1" value=${yaw ?? Math.round(cur?.yaw ?? 90)}
                    show=${`${yaw ?? Math.round(cur?.yaw ?? 90)}° ${compass(yaw ?? cur?.yaw ?? 90)}`} onInput=${d => turn(d)} onChange=${d => turn(d, true)}/>
                <${Range} label="zoom" min="12" max="360" step="5" value=${fov} show=${`${fov}°`} onInput=${zoom} onChange=${f => zoom(f, true)}/>
                <div class="row">
                    <small>${heldAt && left ? `held here, its own again in ${Math.floor(left / 60)}:${String(Math.floor(left % 60)).padStart(2, '0')}` : 'on its own: planes, the tour, the Eiffel show'}</small>
                    <${Btn} on=${!(heldAt && left)} onClick=${release}>auto</${Btn}>
                </div>

                <h2>horizon, eye <${Own} d=${set.horizon} scope=${scope}/></h2>
                <${Range} label="horizon" min="0.3" max="0.85" step="0.01" value=${h} show=${h < 0.5 ? 'look down' : h > 0.7 ? 'look up' : 'level'}
                    onInput=${v => { setH(v); go('aviator.horizon', {h: v}) }} onChange=${v => { go('aviator.horizon', {h: v}, true); reload() }}/>
                <${Range} label="floor" min="-12" max="3" step="1" value=${floors} show=${floors == 0 ? 'window' : (floors > 0 ? '+' : '') + floors}
                    onInput=${v => { setFloors(v); go('aviator.eye', {floors: v}) }} onChange=${v => { go('aviator.eye', {floors: v}, true); reload() }}/>
                <div class="bar"><${Btn} onClick=${() => send('aviator.horizon', {h: null, screen: scope}).then(reload)}>auto horizon</${Btn}>
                    <${Btn} onClick=${() => send('aviator.eye', {floors: 0, screen: scope}).then(reload)}>the window</${Btn}></div>

                <h2>scenes <small>${demo ? (demo === 'around' ? 'once around' : `${demo}, ${sky.hold_s / 60} min`) : 'the sky outside'}</small></h2>
                <div class="bar">
                    <${Btn} on=${demo === 'around'} onClick=${() => send('aviator.demo', {screen: scope})}>once around</${Btn}>
                    ${sky.scenes.map(sc => html`<${Btn} on=${demo === sc} onClick=${() => send('aviator.demo', {scene: sc, screen: scope})}>${sc}</${Btn}>`)}
                </div>

                <h2>layers <${Own} d=${set.off} scope=${scope}/></h2>
                <div class="checks">${['clouds', 'rain', 'planes', 'info'].map(l => html`
                    <${Check} label=${l} checked=${!off.includes(l)} onChange=${on => send('aviator.layer', {layer: l, on, screen: scope}).then(reload)}/>`)}
                </div>

                <h2>outside</h2>
                <table>
                    <tr><td>sun</td><td>${Math.round(sky.sun[0])}° ${compass(sky.sun[0])} · ${sky.sun[1]}° up</td></tr>
                    <tr><td>moon</td><td>${Math.round(sky.moon[0])}° ${compass(sky.moon[0])} · ${sky.moon[1]}° up</td></tr>
                    <tr><td>cover · low · high</td><td>${pct(s.cover)} · ${pct(s.deck)} · ${pct(s.high)}</td></tr>
                    <tr><td>haze · sun out</td><td>${pct(s.haze)} · ${pct(s.sun)}</td></tr>
                    <tr><td>air</td><td>${n(s.temp, '°C', 1)} · ${n(s.wind, ' m/s', 1)}${s.dir != null ? ` from ${compass(s.dir)}` : ''}</td></tr>
                    <tr><td>rain</td><td>${n(s.rate, ' mm/h', 1)}</td></tr>
                    <tr><td>planes</td><td>${sky.planes.filter(p => p[5]).length} watched · ${sky.planes.length}</td></tr>
                </table>
            </div>`
        }


        function RadarTab({scope, set, reload}) {
            // The radar: how far, how high, the trails (for all, the poller's), the map up, its zoom, light and layers by screen.
            const [km, setKm] = useState(set.radius)
            const [alt, setAlt] = useState(set.max_alt)
            const [trail, setTrail] = useState(set.trail / 60)
            const [deg, setDeg] = useState('')
            const [zoom, setZoom] = useState(1)
            useEffect(() => { setDeg(pick(set.map_up, scope, '')); setZoom(pick(set.zoom, scope, 1)) }, [scope, set])
            const go = (action, p) => send(action, {...p, screen: scope}).then(reload)
            const off = pick(set.off, scope, [])
            return html`<div class="tab">
                <h2>planes <${All}/></h2>
                <${Range} label="radius" min="5" max="60" step="5" value=${km} show=${`${km} km`} onInput=${setKm} onChange=${v => send('aviator.radius', {km: v})}/>
                <${Range} label="max alt" min="500" max="13000" step="500" value=${alt} show=${alt >= 13000 ? 'all' : `${alt} m`} onInput=${setAlt} onChange=${v => send('aviator.max_alt', {m: v})}/>
                <${Range} label="trails" min="1" max="10" step="1" value=${trail} show=${`${trail} min`} onInput=${setTrail} onChange=${v => send('aviator.trail', {s: v * 60})}/>

                <h2>map <${Own} d=${set.map_up} scope=${scope}/></h2>
                <div class="row">
                    <span>up</span>
                    ${[['N', 0], ['E', 90], ['S', 180], ['W', 270]].map(([n, d]) => html`<${Btn} on=${+deg === d && deg !== ''} onClick=${() => { setDeg(d); go('aviator.map_up', {deg: d}) }}>${n}</${Btn}>`)}
                    <input type="number" min="0" max="359" step="15" placeholder="deg" value=${deg} onChange=${e => { setDeg(e.currentTarget.value); go('aviator.map_up', {deg: e.currentTarget.value}) }}/>
                </div>
                <${Range} label="zoom" min="0.25" max="4" step="0.25" value=${zoom} show=${`${zoom}x`} onInput=${setZoom} onChange=${v => go('aviator.zoom', {zoom: v})}/>
                <${Check} label="light mode" checked=${pick(set.light, scope, false)} onChange=${on => go('aviator.light', {on})}/>

                <h2>layers <${Own} d=${set.off} scope=${scope}/></h2>
                <div class="checks">${LAYERS.map(l => html`
                    <${Check} label=${l} checked=${!off.includes(l)} onChange=${on => go('aviator.layer', {layer: l, on})}/>`)}
                </div>
            </div>`
        }


        function ShownTab() {
            // The widgets: checked, they come on their schedule; SHOW shows one for a while (checked again) or hides it till its schedule.
            const [s, reload] = useFetch('/shown')
            const [smokes, setSmokes] = useState(null)
            const hm = t => new Date(t * 1000).toTimeString().slice(0, 5)
            if (!s) return html`<div class="tab"><small>loading…</small></div>`
            return html`<div class="tab">
                <h2>stacks <${All}/></h2>
                <${Check} label="bottom stacks" checked=${s.bottom} onChange=${on => send('bottom', {on}).then(reload)}/>
                <h2>widgets <${All}/></h2>
                ${s.widgets.map(n => html`<div class="row">
                    <${Check} label=${n.replace(/_/g, ' ')} checked=${!s.off.includes(n)} onChange=${on => send('widget', {name: n, on}).then(reload)}/>
                    <${Btn} onClick=${() => send(`show_${n}`).then(reload)}>show</${Btn}>
                </div>`)}
                <h2>smokes</h2>
                <div class="smokes row">
                    <span>${smokes && html`<strong>${smokes.count ?? '–'}</strong><sup class="ember">✱</sup> ${(smokes.sessions || []).map(([a, b]) => hm(a) + (b ? '' : '…')).join(' ')}`}</span>
                    <${Btn} on=${!!smokes} onClick=${() => smokes ? setSmokes(null) : getJSON('/smokes').then(setSmokes)}>today</${Btn}>
                </div>
                ${smokes && html`<small><span class="ember">✱</span> an estimate from the study's PM2.5: the neighbour smokes too</small>`}
            </div>`
        }


        function DevTab() {
            const [url, setUrl] = useState('')
            const streams = [['limn-a', 'limn3'], ['limn-b', 'limn4'], ['x2d', 'x2d']]
            return html`<div class="tab">
                <h2>renderers <${All}/></h2>
                <div class="bar">
                    <${Btn} onClick=${() => send('screencap')}>screencap</${Btn}>
                    <${Btn} onClick=${() => send('motion_toggle')} title="pretend someone's there">motion</${Btn}>
                </div>
                <h2>design demo <small>with show design demo</small></h2>
                <div class="bar">
                    <${Btn} onClick=${() => send('show_design_demo')}>show</${Btn}>
                    ${['flex', 'grid', 'stack', 'type', 'box', 'motion', 'scroll', 'media', 'touch'].map(tab => html`
                        <${Btn} onClick=${() => send('design_demo', {tab, page: null})}>${tab}</${Btn}>`)}
                </div>
                <h2>stream <small>with show stream</small></h2>
                <div class="row">
                    <input type="text" placeholder="mjpeg url" value=${url} onInput=${e => setUrl(e.currentTarget.value)}/>
                    <${Btn} onClick=${() => send('set_stream_url', {url})}>set</${Btn}>
                </div>
                <div class="bar">${streams.map(([n, src]) => html`
                    <${Btn} onClick=${() => send('set_stream_url', {url: `http://10.0.1.207:1984/api/stream.mjpeg?src=${src}`})}>${n}</${Btn}>`)}
                </div>
            </div>`
        }


        const Icon = ({name}) => html`<span class="icon" style=${`--i: url(/mdi/${name}.svg)`}></span>`
        const mmss = s => { s = Math.abs(Math.round(s)); const h = Math.floor(s / 3600), m = Math.floor(s / 60) % 60, x = String(s % 60).padStart(2, '0')
                            return h ? `${h}:${String(m).padStart(2, '0')}:${x}` : `${String(m).padStart(2, '0')}:${x}` }

        function TimersTab() {
            // apps/timer.py: the running ones (newest first), a new one, the known ones (the screens' templates).
            const [d, setD] = useState(null)
            const [skew, setSkew] = useState(0)
            const [, tick] = useState(0)
            const [secs, setSecs] = useState(0)
            const [label, setLabel] = useState('')
            const [icon, setIcon] = useState('')
            const [repeat, setRepeat] = useState(false)
            const got = j => { setD(j); setSkew(j.now - Date.now() / 1000) }
            const load = () => getJSON('/timers').then(got).catch(() => {})
            const post = body => fetch('/timers', {method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify(body)}).then(r => r.json()).then(got)
            useEffect(() => { load(); const a = setInterval(load, 5000), b = setInterval(() => tick(n => n + 1), 500); return () => { clearInterval(a); clearInterval(b) } }, [])
            if (!d) return html`<div class="tab"><small>loading…</small></div>`
            const now = Date.now() / 1000 + skew
            const left = t => t.end - now
            return html`<div class="tab">
                <h2>timers <${All}/></h2>
                ${d.timers.length ? d.timers.map(t => html`<div class=${'row' + (t.ringing ? ' ringing' : '')}>
                    <span><${Icon} name=${t.icon}/> ${t.label !== 'T' ? t.label : ''} <code>${left(t) > 0 ? mmss(left(t)) : '+' + mmss(-left(t))}</code> <small>of ${mmss(t.duration)}</small></span>
                    <${Btn} onClick=${() => post({do: 'shift', pk: t.pk, secs: -60})}>-1m</${Btn}>
                    <${Btn} onClick=${() => post({do: 'shift', pk: t.pk, secs: 60})}>+1m</${Btn}>
                    <${Btn} on=${t.repeat} onClick=${() => post({do: 'repeat', pk: t.pk, repeat: !t.repeat})} title="again when done">repeat</${Btn}>
                    ${t.ringing && html`<${Btn} on onClick=${() => post({do: 'mute'})}>mute</${Btn}>`}
                    <${Btn} onClick=${() => post({do: 'cancel', pk: t.pk})}>stop</${Btn}>
                </div>`) : html`<small>none</small>`}
                <h2>new</h2>
                <div class="row">
                    <code>${mmss(secs)}</code>
                    ${[[30, '+30s'], [60, '+1m'], [300, '+5m'], [600, '+10m']].map(([s, n]) => html`<${Btn} onClick=${() => setSecs(secs + s)}>${n}</${Btn}>`)}
                    <${Btn} onClick=${() => setSecs(0)}>clear</${Btn}>
                </div>
                <div class="row">
                    <input type="text" placeholder="label" value=${label} onInput=${e => setLabel(e.currentTarget.value)}/>
                    <${Check} label="repeat" checked=${repeat} onChange=${setRepeat}/>
                </div>
                <div class="icons">${d.icons.map(n => html`<${Btn} on=${icon === n} title=${n} onClick=${() => setIcon(icon === n ? '' : n)}><${Icon} name=${n}/></${Btn}>`)}</div>
                <div class="bar">
                    <${Btn} onClick=${() => secs && post({do: 'start', duration: secs, label, icon, repeat}).then(() => setSecs(0))}>start</${Btn}>
                    <${Btn} onClick=${() => secs && icon && post({do: 'remember', duration: secs, label, icon})} title="needs an icon">save as known</${Btn}>
                </div>
                <h2>known <${All}/></h2>
                ${d.known.length ? d.known.map(k => html`<div class="row">
                    <span><${Icon} name=${k.icon}/> ${k.label} <small>${mmss(k.duration)}</small></span>
                    <${Btn} onClick=${() => post({do: 'start', duration: k.duration, label: k.label, icon: k.icon})}>start</${Btn}>
                    <${Btn} onClick=${() => { setSecs(k.duration); setLabel(k.label); setIcon(k.icon) }} title="to change it: save again">edit</${Btn}>
                    <${Btn} onClick=${() => post({do: 'forget', icon: k.icon})}>forget</${Btn}>
                </div>`) : html`<small>none: save one here or from the dial</small>`}
                <h2>dial</h2>
                <${Check} label="a turn starts from the timer in front" checked=${d.prefs.from_front} onChange=${on => post({do: 'prefs', from_front: on})}/>
            </div>`
        }


        const TRAIN_STEPS = `20 stand clear of the desk
30 type on the laptop
30 use this PC: keyboard, mouse
20 reach to limn, touch it
15 look at the monitor, point at it
15 lean in
15 sit back
15 hand near the screen: sweep left, right
15 hand near the screen: closer, farther
15 stand up, leave`

        function TofTab() {
            // A ToF training session at the desk: the steps on its screen one by one, recorded the while; the
            // sessions kept (when each step was) to label the recordings by. One "seconds text" a line.
            const [sessions, reload] = useFetch('/tof/train', 10000)
            const [text, setText] = useState(kept('di.tof.steps') || TRAIN_STEPS)
            const [start, setStart] = useState(10)
            const steps = text.split('\n').map(l => l.trim().match(/^(\d+(?:\.\d+)?)\s+(.+)$/)).filter(Boolean).map(m => [+m[1], m[2]])
            const total = start + steps.reduce((a, [s]) => a + s, 0)
            const now = Date.now() / 1000
            const running = (sessions || []).find(s => now < s.t0 + s.steps.reduce((a, [d]) => a + d, 0))
            const go = () => fetch('/tof/train', {method: 'POST', headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({screen: 'distudy', steps, start})}).then(reload)
            return html`<div class="tab">
                <h2>tof training <small>desk</small></h2>
                <textarea rows="12" value=${text} onInput=${e => { setText(e.currentTarget.value); kept('di.tof.steps', e.currentTarget.value) }}/>
                <${Range} label="starts in" min="0" max="60" step="5" value=${start} show=${`${start} s`} onInput=${setStart}/>
                <div class="row">
                    <span class="grow"><small>${steps.length} steps, ${Math.round(total / 60 * 10) / 10} min, recorded</small></span>
                    <${Btn} onClick=${() => setText(TRAIN_STEPS)}>default</${Btn}>
                    <${Btn} on=${!!running} onClick=${() => !running && steps.length && go()}>${running ? 'running…' : 'start'}</${Btn}>
                </div>
                <h2>sessions</h2>
                ${(sessions || []).map(s => html`<div class="row"><span class="grow"><code>${new Date(s.t0 * 1000).toLocaleString()}</code>
                    <small>${s.steps.length} steps</small></span></div>`)}
            </div>`
        }

        const TABS = {view: ViewTab, sky: SkyTab, radar: RadarTab, shown: ShownTab, timers: TimersTab, tof: TofTab, dev: DevTab}

        function Panel() {
            // Scoped by the screen picked (here, or under its frame): 'all' sets every screen, the screens' own go.
            const [scope, setScope] = useState(kept('di.scope') || 'all')
            const [tab, setTab] = useState(TABS[kept('di.tab')] ? kept('di.tab') : 'view')
            const [undocked, setUndocked] = useState(null)
            const [set, reload] = useFetch('/aviator/settings')
            const [sky] = useFetch('/aviator/sky', tab === 'sky' || tab === 'view' ? 2000 : 0)
            const panel = document.body.classList.contains('panel')

            useEffect(() => { kept('di.scope', scope); kept('di.tab', tab) }, [scope, tab])
            useEffect(() => {
                document.querySelectorAll('figure').forEach(f => {
                    f.classList.toggle('picked', f.dataset.screen === scope)
                    f.querySelector('button').onclick = () => setScope(s => s === f.dataset.screen ? 'all' : f.dataset.screen)
                })
            }, [scope])
            useEffect(() => {
                document.body.classList.toggle('undocked', !!undocked)
                if (!undocked) return
                const t = setInterval(() => undocked.closed && setUndocked(null), 1000)
                return () => clearInterval(t)
            }, [undocked])

            const Tab = TABS[tab]
            return html`
                <div class="top">
                    <div class="bar">
                        <strong class="grow">controls</strong>
                        ${!panel && html`<${Btn} onClick=${() => setUndocked(window.open('?panel', 'disinfo-panel', 'popup,width=380,height=860'))}>undock</${Btn}>`}
                    </div>
                    <div class="bar">
                        <${Btn} on=${scope === 'all'} onClick=${() => setScope('all')}>all</${Btn}>
                        ${SCREENS.map(([s, n]) => html`<${Btn} on=${scope === s} onClick=${() => setScope(s)}>${n}</${Btn}>`)}
                    </div>
                </div>
                <nav class="tabs">${Object.keys(TABS).map(t => html`<${Btn} on=${tab === t} onClick=${() => setTab(t)}>${t}</${Btn}>`)}</nav>
                ${set ? html`<${Tab} scope=${scope} set=${set} reload=${reload} sky=${sky}/>` : html`<div class="tab"><small>loading…</small></div>`}`
        }

        render(html`<${Panel}/>`, document.getElementById('controls'));
    </script>
</body>
</html>
