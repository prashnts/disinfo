<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, minimum-scale=1, viewport-fit=cover">
    <title>disinfo!</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background: #2c2c2c;
        }

        h1 {
            color: #fff;
            text-align: center;
            font-family: monospace;
            font-size: 2em;
            margin: 0;
            padding: 1em;
        }

        canvas {
            /* padding: 2px; */
            margin: 5px auto;
            max-width: 100%;
            image-rendering: pixelated;
            filter: brightness(1.2) contrast(0.9);
            display: block;
            border-radius: 4px;
            border: 3px solid #0C161C;
            /* filter: url('#gamma'); */
        }

        .screens canvas {
            width: calc(128px * 2);
        }

        .screens #pcstate {
            width: calc(200px * 2);
        }

        .screens #entry {
            width: calc(400px * 2);
        }

        #status {
            color: #888;
            font-family: monospace;
            text-align: center;
        }

        #status:empty {
            display: none;
        }

        canvas:not(.live) {
            display: none;
        }

        canvas {
            touch-action: none;
        }

        .remote_button {
            font-size: 20px;
            margin: 5px;
            min-width: 60px;
            min-height: 30px;
            touch-action: manipulation;
        }

        #controls {
            margin: auto;
            max-width: 300px;
            display: flex;
            gap: 5px;
        }

        .main {
            display: flex;
            flex-direction: column;
            justify-content: left;
            padding: 0 10px;
            max-width: 500px;
            margin: auto;
            align-items: center;
        }

        .in.slider label {
            display: flex;
            align-items: center;
            gap: 5px;
        }
        .in.slider input {
            width: 120px;
        }

    </style>
</head>
<body>
    <h1>disinfo!</h1>
    <div class="main">
        <p id='status'>connecting…</p>
        <div class="screens">
            <canvas id='study'></canvas>
            <canvas id='salon'></canvas>
            <canvas id='pcstate'></canvas>
            <canvas id='entry'></canvas>
        </div>
        <div id='controls'>
        </div>
    </div>

    <svg height="0">
        <filter id="gamma">
            <feComponentTransfer>
                <feFuncR type="gamma" exponent="0.85" amplitude="1.5" offset="0" />
                <feFuncG type="gamma" exponent="0.85" amplitude="1.5" offset="0" />
                <feFuncB type="gamma" exponent="0.85" amplitude="1.5" offset="0" />
            </feComponentTransfer>
        </filter>
    </svg>
    <script type="module">
        function toggleFullScreen(el) {
            if (!document.fullscreenElement) {
                el.requestFullscreen();
            } else {
                document.exitFullscreen?.();
            }
        }
        const screenEl = document.getElementById('screen');

        document.addEventListener('keydown', (e) => {
            if (e.key === 'Enter') {
                toggleFullScreen(screenEl)
            }
        })

    </script>
    <script type="module">
        const WS_RETRY_DELAY = 2000;
        // /ws2 messages, see disinfo/transport.py: header, then a whole PNG, or the regions that changed.
        const HEADER = 21, REGION = 12;
        const status = document.getElementById('status');
        let seen = false;

        const png = (buf, at, n) => createImageBitmap(new Blob([new Uint8Array(buf, at, n)], {type: 'image/png'}));

        const connect = function (screen, canvas_id) {
            const protocol = window.location.protocol === 'https:' ? 'wss' : 'ws';
            const ws = new WebSocket(`${protocol}://${window.location.host}/ws2/${screen}?fmt=png`);
            ws.binaryType = 'arraybuffer';
            const canvas = document.getElementById(canvas_id);
            const ctx = canvas.getContext('2d');
            let seq = 0, resyncing = false, drawing = Promise.resolve();

            async function apply(buf) {
                const v = new DataView(buf);
                const next = v.getUint32(4, true), base = v.getUint32(8, true);
                if (!base) {
                    const frame = await png(buf, HEADER, buf.byteLength - HEADER);
                    canvas.width = v.getUint16(16, true);
                    canvas.height = v.getUint16(18, true);
                    ctx.drawImage(frame, 0, 0);
                    seq = next, resyncing = false;
                    canvas.classList.add('live');
                    seen = true;
                    status.textContent = '';
                    return;
                }
                if (base !== seq) {
                    if (!resyncing) ws.send(JSON.stringify({resync: 1}));
                    resyncing = true;
                    return;
                }
                // Decoded first, then drawn together: never half a frame.
                const parts = [];
                let at = HEADER + 2;
                for (let i = 0; i < v.getUint16(HEADER, true); i++) {
                    const n = v.getUint32(at + 8, true);
                    parts.push([v.getUint16(at, true), v.getUint16(at + 2, true), png(buf, at + REGION, n)]);
                    at += REGION + n;
                }
                const frames = await Promise.all(parts.map(p => p[2]));
                parts.forEach(([x, y], i) => ctx.drawImage(frames[i], x, y));
                seq = next;
            }

            // Touches, in the frame's px: the server finds what's under them (buttons drawn by disinfo).
            const touch = (phase) => (e) => {
                if (phase !== 'down' && !canvas.hasPointerCapture(e.pointerId)) return;
                if (phase === 'down') canvas.setPointerCapture(e.pointerId);
                const r = canvas.getBoundingClientRect();
                const x = Math.floor((e.clientX - r.left - canvas.clientLeft) * canvas.width / canvas.clientWidth);
                const y = Math.floor((e.clientY - r.top - canvas.clientTop) * canvas.height / canvas.clientHeight);
                if (ws.readyState === WebSocket.OPEN) ws.send(JSON.stringify({touch: [x, y, phase]}));
            };
            canvas.onpointerdown = touch('down');
            canvas.onpointermove = touch('move');
            canvas.onpointerup = touch('up');

            ws.onmessage = function (event) {
                // Text: acts, alive. Frames are decoded in order.
                if (typeof event.data !== 'string') drawing = drawing.then(() => apply(event.data));
            };

            ws.onopen = function () {
                if (!seen) status.textContent = 'waiting for renderer…';
            };

            ws.onclose = function () {
                console.warn(`Disinfo connection lost. Retrying in ${WS_RETRY_DELAY / 1000}s.`)
                status.textContent = 'reconnecting…';
                setTimeout(() => connect(screen, canvas_id), WS_RETRY_DELAY);
            }

            ws.onerror = function () {
                ws.close();
            }
        }
        connect('distudy', 'study');
        connect('disalon', 'salon');
        // Each server shows the screens it renders, the others stay hidden.
        connect('di_pcstate', 'pcstate');
        connect('dientry', 'entry');
    </script>
    <script type="module">
        import { h, Component, render } from 'https://esm.sh/preact@10';
        import { useState, useEffect } from 'https://esm.sh/preact@10/hooks';
        import htm from 'https://esm.sh/htm@3';

        // Initialize htm with Preact
        const html = htm.bind(h);

        function RemoteButton(props) {
            const didClick = () => {
                fetch('/remote', {
                    method: 'POST',
                    body: JSON.stringify({
                        action: props.action,
                        payload: props.payload,
                    }),
                    headers: {
                        'Content-Type': 'application/json'
                    },
                }).then(() => {
                    console.log('Sent button press')
                })
            }
            return html`<button onClick=${didClick} class='remote_button'>${props.title || props.action}</button>`;
        }

        function StreamURL(props) {
            const [url, setUrl] = useState('')
            const didChange = e => setUrl(e.currentTarget.value)
            return html`<div>
                <div>
                    <input onChange=${didChange} name="link" autocomplete="stream-url" type="text"/>
                    <${RemoteButton} action="set_stream_url" payload=${{url}} />
                </div>
                <div>
                    <${RemoteButton} action="set_stream_url" payload=${{url: "http://10.0.1.207:1984/api/stream.mjpeg?src=limn3"}} title="limn-a" />
                    <${RemoteButton} action="set_stream_url" payload=${{url: "http://10.0.1.207:1984/api/stream.mjpeg?src=limn4"}} title="limn-b" />
                    <${RemoteButton} action="set_stream_url" payload=${{url: "http://10.0.1.207:1984/api/stream.mjpeg?src=x2d"}} title="x2d" />
                </div>
            </div>`
        }

        function RadarRadius(props) {
            // How far the radar shows, and the planes that get a card: km from home.
            const [km, setKm] = useState(40)
            const didChange = e => {
                setKm(e.currentTarget.value)
                fetch('/remote', {
                    method: 'POST',
                    body: JSON.stringify({action: 'aviator.radius', payload: {km: e.currentTarget.value}}),
                    headers: {'Content-Type': 'application/json'},
                })
            }
            return html`
                <${RemoteButton} action="show_planes" />
                <div class="in slider">
                    <label>
                        <strong>Map Radius</strong>
                        <input type="range" min="5" max="60" step="5" value=${km} onChange=${didChange}/>
                        <code>${km}km</code>
                    </label>
                </div>
                <${RemoteButton} action="aviator.view" payload=${{view: 'map'}} title="map" />
                <${RemoteButton} action="aviator.view" payload=${{view: 'sky'}} title="sky" />
                <${RemoteButton} action="aviator.view" payload=${{view: 'solar'}} title="solar" />
                `
        }

        function MapLayers(props) {
            // The radar's map: light mode and the layers, on every screen. What's set is read back on load.
            const names = ['builtup', 'green', 'water', 'roads', 'transit', 'clouds', 'rain', 'wind']
            const [light, setLight] = useState(false)
            const [off, setOff] = useState([])
            useEffect(() => {
                fetch('/aviator/settings').then(r => r.json()).then(s => { setLight(s.light); setOff(s.off) })
            }, [])
            const send = (action, payload) => fetch('/remote', {
                method: 'POST',
                body: JSON.stringify({action, payload}),
                headers: {'Content-Type': 'application/json'},
            })
            const setLayer = (name, on) => {
                setOff(on ? off.filter(n => n !== name) : [...off, name])
                send('aviator.layer', {layer: name, on})
            }
            return html`<div>
                <label><input type="checkbox" checked=${light} onChange=${e => { setLight(e.currentTarget.checked); send('aviator.light', {on: e.currentTarget.checked}) }}/> Light Mode</label>
                ${names.map(n => html`<div>
                        <label> <input type="checkbox" checked=${!off.includes(n)} onChange=${e => setLayer(n, e.currentTarget.checked)}/> ${n}</label>
                    </div>`)}
            </div>`
        }

        function TrailLength(props) {
            // How long the radar's trails are: minutes, the planes with a card show their whole approach.
            const [min, setMin] = useState(3)
            const didChange = e => {
                setMin(e.currentTarget.value)
                fetch('/remote', {
                    method: 'POST',
                    body: JSON.stringify({action: 'aviator.trail', payload: {s: e.currentTarget.value * 60}}),
                    headers: {'Content-Type': 'application/json'},
                })
            }
            return html`<div class="in slider">
                <label>
                    <strong>trails</strong>
                    <input type="range" min="1" max="10" step="1" value=${min} onChange=${didChange}/>
                    <code>${min} min</code>
                </label>
            </div>`
        }

        function MaxAltitude(props) {
            // Planes above this are left out: m, the top is no filter.
            const [m, setM] = useState(13000)
            const didChange = e => {
                setM(e.currentTarget.value)
                fetch('/remote', {
                    method: 'POST',
                    body: JSON.stringify({action: 'aviator.max_alt', payload: {m: e.currentTarget.value}}),
                    headers: {'Content-Type': 'application/json'},
                })
            }
            return html`<div class="in slider">
                <label>
                    <strong>max alt</strong>
                    <input type="range" min="500" max="13000" step="500" value=${m} onChange=${didChange}/>
                    <code>${m >= 13000 ? 'all' : m + ' m'}</code>
                </label>
            </div>`
        }

        function MapAngle(props) {
            // The bearing up on a screen's map: where one faces looking at it, and its zoom. Its config's after a restart.
            const [screen, setScreen] = useState('all')
            const [deg, setDeg] = useState('')
            const [zoom, setZoom] = useState(1)
            const sendZoom = e => {
                setZoom(e.currentTarget.value)
                fetch('/remote', {
                    method: 'POST',
                    body: JSON.stringify({action: 'aviator.zoom', payload: {screen, zoom: e.currentTarget.value}}),
                    headers: {'Content-Type': 'application/json'},
                })
            }
            const send = () => fetch('/remote', {
                method: 'POST',
                body: JSON.stringify({action: 'aviator.map_up', payload: {screen, deg}}),
                headers: {'Content-Type': 'application/json'},
            })
            return html`<label>map up
                <select onChange=${e => setScreen(e.currentTarget.value)} value=${screen}>
                    ${['all', 'disalon', 'distudy', 'di_pcstate', 'dientry'].map(s => html`<option value=${s}>${s}</option>`)}
                </select>
                <input type="number" min="0" max="359" step="15" size="4" placeholder="deg" value=${deg} onChange=${e => setDeg(e.currentTarget.value)}/>°
                <button class='remote_button' onClick=${send}>set</button></label>
                <label>zoom <input type="range" min="0.25" max="4" step="0.25" value=${zoom} onChange=${sendZoom}/> ${zoom}x</label>`
        }

        function TriggerButton(props) {
            const didClick = () => {
                fetch('/trigger', {
                    method: 'POST',
                    body: JSON.stringify({
                        endpoint: props.endpoint,
                    }),
                    headers: {
                        'Content-Type': 'application/json'
                    },
                }).then(() => {
                    console.log('Sent trigger')
                })
            }
            return html`<button onClick=${didClick} class='trigger_button'>${props.endpoint}</button>`;
        }


        function App(props) {
            return html`
                <div>
                    <${RemoteButton} action="show_metro" />
                    <${RemoteButton} action="show_twentytwo" />
                    <${RemoteButton} action="screencap" />
                </div>
                <div>
                    <${RemoteButton} action="show_sensors" />
                    <${RemoteButton} action="show_news" />
                    <${RemoteButton} action="motion_toggle" />
                    <${RemoteButton} action="show_fonts_credit" />
                    <${RemoteButton} action="show_printers" />
                    <${RemoteButton} action="show_flex_demo" title="flex demo" />
                    <${RemoteButton} action="layout_demo_tab" payload=${{tab: 'flex'}} title="flex tab" />
                    <${RemoteButton} action="layout_demo_tab" payload=${{tab: 'grid'}} title="grid tab" />
                </div>
                <div>
                    <${RadarRadius}/>
                    <${MaxAltitude}/>
                    <${TrailLength}/>
                    <${MapLayers}/>
                    <${MapAngle}/>
                </div>
                <div>
                    <${RemoteButton} action="show_stream" />
                    <${StreamURL}/>
                </div>`;
        }

        render(html`<${App} name="World" />`, document.getElementById('controls'));
    </script>
</body>
</html>
