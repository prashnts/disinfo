name: test

on: [push, pull_request]

# Core only: discore with its own (small) deps. The full app is tested in docker.yml.
jobs:
  discore:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: libs/discore
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get install -y --no-install-recommends libcairo2
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          cache-dependency-glob: libs/discore/pyproject.toml
      - run: uv run --python 3.13 pytest
