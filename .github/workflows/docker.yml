name: docker

# Images are published when a version is tagged (git tag v2026.10.05 && git push --tags), not on every push.
on:
  push:
    tags: ['v*']
  workflow_dispatch:

env:
  IMAGE: ghcr.io/${{ github.repository }}

jobs:
  # Full test before building: app deps, discore tests, render smoke test.
  test:
    runs-on: ubuntu-24.04
    services:
      redis:
        image: redis:8-alpine
        ports: ['6379:6379']
    env:
      DI_CONFIG_PATH: .config.sample.json
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libcairo2-dev pkg-config portaudio19-dev
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - run: uv sync --frozen --no-dev
      - run: uv run --no-sync --with pytest pytest libs/discore/tests
      # Fetch the fonts once, so the server and the renderer don't both download them.
      - run: uv run --no-sync python -c 'import disinfo.fonts'
      - name: render smoke test
        run: |
          # Not `uv run`: a server left running holds the uv cache lock and hangs the post-job cache prune.
          .venv/bin/uvicorn disinfo.web.server:app --port 4200 &
          trap 'kill $!' EXIT
          timeout 60 sh -c 'until curl -fs localhost:4200/ >/dev/null; do sleep 1; done'
          uv run --no-sync python -m disinfo.renderers.background --fps 30 --n-frames 60
          curl -fsS -o frame.png localhost:4200/png/disalon
          file frame.png | grep -q 'PNG image'

  build:
    needs: test
    strategy:
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-24.04
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: app
        uses: docker/build-push-action@v6
        with:
          target: app
          platforms: ${{ matrix.platform }}
          outputs: type=image,name=${{ env.IMAGE }},push-by-digest=true,name-canonical=true,push=true
          cache-from: type=gha,scope=${{ matrix.platform }}
          cache-to: type=gha,mode=max,scope=${{ matrix.platform }}
      - id: demo
        uses: docker/build-push-action@v6
        with:
          target: demo
          platforms: ${{ matrix.platform }}
          outputs: type=image,name=${{ env.IMAGE }},push-by-digest=true,name-canonical=true,push=true
          cache-from: type=gha,scope=${{ matrix.platform }}
      - run: |
          mkdir -p /tmp/digests/app /tmp/digests/demo
          a='${{ steps.app.outputs.digest }}'
          d='${{ steps.demo.outputs.digest }}'
          touch "/tmp/digests/app/${a#sha256:}" "/tmp/digests/demo/${d#sha256:}"
      - uses: actions/upload-artifact@v4
        with:
          name: digest-${{ matrix.runner }}
          path: /tmp/digests
          retention-days: 1

  merge:
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      packages: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: /tmp/digests
          pattern: digest-*
          merge-multiple: true
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: app
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=raw,value=latest
            type=ref,event=tag
      - id: demo
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          flavor: latest=false
          tags: |
            type=raw,value=demo
            type=ref,event=tag,suffix=-demo
      - working-directory: /tmp/digests
        env:
          APP: ${{ steps.app.outputs.json }}
          DEMO: ${{ steps.demo.outputs.json }}
        run: |
          for t in app demo; do
            [ $t = app ] && meta="$APP" || meta="$DEMO"
            docker buildx imagetools create \
              $(jq -cr '.tags | map("-t " + .) | join(" ")' <<< "$meta") \
              $(cd $t && printf '${{ env.IMAGE }}@sha256:%s ' *)
          done
